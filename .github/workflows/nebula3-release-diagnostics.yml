name: Optional Nebula 3 release diagnostics

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable nebula-v3.* tag
        required: true
        type: string
      preparation_run_id:
        description: Preparation run ID for installer or artifact diagnostics
        required: false
        type: string
      diagnostics:
        description: Optional checks to run; none are release prerequisites
        required: true
        type: choice
        options: [source, sandbox, installers, artifact, all]

permissions:
  contents: read
  actions: read

jobs:
  source:
    if: inputs.diagnostics == 'source' || inputs.diagnostics == 'all'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Run former packaging and compile diagnostics
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
          python -m pip install "poetry==2.1.3"
          poetry install --with dev --no-interaction
          poetry run pytest --collect-only -q tests/v3/test_packaging.py packaging/updater/test_generate_manifest.py
          poetry run pytest -q tests/v3/test_packaging.py packaging/updater/test_generate_manifest.py
          npm --prefix ui ci
          npm --prefix ui run build
          install -d -m 0755 ui/src-tauri/binaries
          touch ui/src-tauri/binaries/nebula-core-x86_64-unknown-linux-gnu
          chmod +x ui/src-tauri/binaries/nebula-core-x86_64-unknown-linux-gnu
          cargo check --locked --manifest-path ui/src-tauri/Cargo.toml
          cargo check --locked --features direct-updater --manifest-path ui/src-tauri/Cargo.toml

  sandbox:
    if: inputs.diagnostics == 'sandbox' || inputs.diagnostics == 'all'
    runs-on: ubuntu-22.04
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Run former sandbox integration diagnostic
        run: |
          python -m pip install "poetry==2.1.3"
          poetry install --with dev --no-interaction
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs
          podman info --format '{{.Host.Security.Rootless}}' | grep -Fx true
          runner_uid="$(id -u)"
          user_service="/sys/fs/cgroup/user.slice/user-${runner_uid}.slice/user@${runner_uid}.service"
          for control_group in \
            /sys/fs/cgroup/user.slice \
            "/sys/fs/cgroup/user.slice/user-${runner_uid}.slice" \
            "$user_service" \
            "$user_service/user.slice"
          do
            test -f "$control_group/cgroup.controllers"
            grep -qw cpu "$control_group/cgroup.controllers"
            echo +cpu | sudo tee "$control_group/cgroup.subtree_control" >/dev/null
          done
          grep -qw cpu "$user_service/user.slice/cgroup.subtree_control"
          export NEBULA_TEST_CONTAINER_RUNTIME=/usr/bin/podman
          podman build --file tests/v3/integration/Containerfile.operator-runtime \
            --tag localhost/nebula-operator-runtime:release .
          NEBULA_TEST_RUNTIME_IMAGE=localhost/nebula-operator-runtime:release \
            poetry run pytest -q tests/v3/test_sandbox_integration.py

  installers:
    if: inputs.diagnostics == 'installers' || inputs.diagnostics == 'all'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12-slim
            name: debian-12
          - image: kalilinux/kali-rolling:latest
            name: kali-current
    container: ${{ matrix.image }}
    steps:
      - name: Require an exact preparation run
        env:
          PREPARATION_RUN_ID: ${{ inputs.preparation_run_id }}
        run: |
          [[ "$PREPARATION_RUN_ID" =~ ^[0-9]+$ ]]
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nebula3-linux-x64
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ inputs.preparation_run_id }}
      - name: Install and uninstall on ${{ matrix.name }}
        run: |
          version="${{ inputs.release_tag }}"
          version="${version#nebula-v}"
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y xauth xvfb "./release-assets/Nebula-$version-linux-x86_64.deb"
          xvfb-run -a /usr/bin/nebula --self-test
          browser="$(find /usr -path '*/playwright-browsers/*' -type f \\( -name chrome -o -name headless_shell -o -name chrome-headless-shell \\) -perm /111 -print -quit)"
          test -n "$browser"
          "$browser" --headless --no-sandbox --disable-gpu --dump-dom about:blank | grep -F '<html'
          /usr/bin/nebula-core doctor --data-dir /tmp/nebula-diagnostic-doctor --json
          DEBIAN_FRONTEND=noninteractive apt-get remove -y nebula
          test ! -e /usr/bin/nebula
          test ! -e /usr/bin/nebula-ui
          test ! -e /usr/bin/nebula-core

  artifact:
    if: inputs.diagnostics == 'artifact' || inputs.diagnostics == 'all'
    runs-on: ubuntu-22.04
    environment:
      name: desktop-release
      deployment: false
    steps:
      - name: Require an exact preparation run
        env:
          PREPARATION_RUN_ID: ${{ inputs.preparation_run_id }}
        run: |
          [[ "$PREPARATION_RUN_ID" =~ ^[0-9]+$ ]]
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nebula3-linux-x64
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ inputs.preparation_run_id }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Run former crash-cleanup and negative signature diagnostics
        env:
          NEBULA_UPDATER_PUBLIC_KEY: ${{ secrets.NEBULA_UPDATER_PUBLIC_KEY }}
        run: |
          version="${{ inputs.release_tag }}"
          version="${version#nebula-v}"
          deb="release-assets/Nebula-$version-linux-x86_64.deb"
          appimage="release-assets/Nebula-$version-linux-x86_64.AppImage"
          sudo apt-get update
          sudo apt-get install -y xvfb libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev "$PWD/$deb"
          xvfb-run -a python3 scripts/test_desktop_crash_cleanup.py /usr/bin/nebula-ui
          test -n "$NEBULA_UPDATER_PUBLIC_KEY"
          tampered="$RUNNER_TEMP/tampered.AppImage"
          cp "$appimage" "$tampered"
          printf tampered >> "$tampered"
          cargo build --locked --quiet --manifest-path ui/src-tauri/Cargo.toml \
            --example verify_update_signature
          if ui/src-tauri/target/debug/examples/verify_update_signature \
            "$tampered" "$appimage.sig" "$NEBULA_UPDATER_PUBLIC_KEY"; then
            printf 'tampered updater unexpectedly passed signature verification\n' >&2
            exit 1
          fi
