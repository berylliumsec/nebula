name: Prepare Nebula 3 Linux release

on:
  push:
    tags:
      - "nebula-v3.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing nebula-v3.* tag to prepare
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: nebula3-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      commit: ${{ steps.release.outputs.commit }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      build_timestamp: ${{ steps.release.outputs.build_timestamp }}
    steps:
      - name: Require repository admin for release preparation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_ACTOR_ID: ${{ github.actor_id }}
          RELEASE_SENDER_ID: ${{ github.event.sender.id }}
          RELEASE_SENDER_TYPE: ${{ github.event.sender.type }}
          RELEASE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RELEASE_APP_BOT_ID: ${{ vars.NEBULA_RELEASE_APP_BOT_ID }}
          RELEASE_APP_SLUG: ${{ vars.NEBULA_RELEASE_APP_SLUG }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] &&
             [[ "$RELEASE_APP_BOT_ID" =~ ^[1-9][0-9]*$ ]] &&
             [ -n "$RELEASE_APP_SLUG" ] &&
             [ "$RELEASE_ACTOR_ID" = "$RELEASE_APP_BOT_ID" ] &&
             [ "$RELEASE_SENDER_ID" = "$RELEASE_APP_BOT_ID" ] &&
             [ "$RELEASE_SENDER_TYPE" = Bot ] &&
             [ "$RELEASE_ACTOR" = "${RELEASE_APP_SLUG}[bot]" ]; then
            if [ "$RELEASE_TRIGGERING_ACTOR" != "$RELEASE_ACTOR" ]; then
              permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$RELEASE_TRIGGERING_ACTOR/permission" --jq .permission)"
              test "$permission" = admin || { echo 'Only repository admins may rerun App releases.' >&2; exit 1; }
            fi
            echo 'Verified dedicated release App dispatch.'
            exit 0
          fi
          if [ "$RELEASE_TRIGGERING_ACTOR" != "$RELEASE_ACTOR" ]; then
            permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$RELEASE_TRIGGERING_ACTOR/permission" --jq .permission)"
            test "$permission" = admin || { echo 'Only repository admins may rerun releases.' >&2; exit 1; }
          fi
          permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$RELEASE_ACTOR/permission" --jq .permission)"
          test "$permission" = admin || { echo 'Only repository admins may prepare a release.' >&2; exit 1; }
      - name: Check out the immutable release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref_name }}
      - name: Validate tag, commit, and synchronized versions
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            nebula-v3.*) ;;
            *) printf 'invalid Nebula 3 release tag: %s\n' "$RELEASE_TAG" >&2; exit 1 ;;
          esac
          version="${RELEASE_TAG#nebula-v}"
          python scripts/nebula3_version.py check --expected "$version"
          test -s "docs/releases/$version.md"
          test "$(git tag --points-at HEAD | grep -Fx "$RELEASE_TAG")" = "$RELEASE_TAG"
          case "$version" in
            *-*) channel=prerelease; prerelease=true ;;
            *) channel=stable; prerelease=false ;;
          esac
          commit="$(git rev-parse HEAD)"
          source_commit="$(sed -n 's/.*<!-- nebula-source-sha: \([0-9a-f]\{40\}\) -->.*/\1/p' "docs/releases/$version.md" | head -n 1)"
          if test -z "$source_commit"; then source_commit="$commit"; fi
          git merge-base --is-ancestor "$source_commit" "$commit"
          test "$source_commit" = "$(git rev-parse origin/main)" || {
            echo 'Release source is not the exact current main commit.' >&2; exit 1;
          }
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$source_commit&per_page=30" \
            | jq -e --arg sha "$source_commit" \
              '.workflow_runs | any(.event == "push" and .conclusion == "success" and .head_sha == $sha)' >/dev/null
          build_timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$version"
            printf 'channel=%s\n' "$channel"
            printf 'prerelease=%s\n' "$prerelease"
            printf 'commit=%s\n' "$commit"
            printf 'source_commit=%s\n' "$source_commit"
            printf 'build_timestamp=%s\n' "$build_timestamp"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    environment:
      name: desktop-release
      deployment: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      NEBULA_VERSION: ${{ needs.validate.outputs.version }}
      NEBULA_RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      NEBULA_BUILD_TARGET: ${{ matrix.target }}
      NEBULA_BUILD_COMMIT: ${{ needs.validate.outputs.commit }}
      NEBULA_BUILD_TIMESTAMP: ${{ needs.validate.outputs.build_timestamp }}
      NEBULA_UPDATE_CHANNEL: ${{ needs.validate.outputs.channel }}
      NEBULA_UPDATE_ENDPOINT: https://berylliumsec.github.io/nebula/updates/${{ needs.validate.outputs.channel }}/latest.json
      NEBULA_UPDATER_PUBLIC_KEY: ${{ secrets.NEBULA_UPDATER_PUBLIC_KEY }}
    steps:
      - name: Check out the validated tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install Linux bundler libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libfuse2 patchelf xvfb
      - name: Validate protected updater credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$NEBULA_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
      - name: Install the locked Nebula 3 build boundary
        run: |
          python -m pip install "poetry==2.1.3"
          poetry install --with dev --no-interaction
          npm --prefix ui ci
          python scripts/nebula3_version.py check --expected "$NEBULA_VERSION"
          poetry run python -m scripts.stage_playwright_runtime \
            ui/src-tauri/resources/playwright-browsers \
            --target "${{ matrix.target }}"
          poetry run python -m scripts.stage_notebook_runtime \
            ui/src-tauri/resources/notebook-runtime \
            --target "${{ matrix.target }}"
      - name: Build the production UI embedded in both Core distributions
        run: |
          poetry run python -m scripts.generate_third_party_notices \
            --root "$GITHUB_WORKSPACE" \
            --target "${{ matrix.target }}" \
            --output build/nebula-core-metadata/THIRD_PARTY_NOTICES.txt
          npm --prefix ui run build
      - name: Generate the direct-build updater configuration
        run: python scripts/tauri_release_config.py "$RUNNER_TEMP/tauri-updater.conf.json"
      - name: Build signed direct AppImage and managed DEB
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          stage="$RUNNER_TEMP/release-stage"
          bundle="ui/src-tauri/target/${{ matrix.target }}/release/bundle"
          install -d -m 0755 "$stage"

          # Earlier validation can import the portable interpreter and create
          # bytecode in the writable build tree. Restage pristine resources.
          poetry run python -m scripts.stage_notebook_runtime \
            ui/src-tauri/resources/notebook-runtime \
            --target "${{ matrix.target }}"
          NEBULA_DISTRIBUTION_CHANNEL=direct poetry run python -m scripts.build_nebula_core
          sidecar="$(find ui/src-tauri/binaries -maxdepth 1 -type f -name 'nebula-core-*' -print -quit)"
          test -n "$sidecar"
          "$sidecar" doctor --data-dir "$RUNNER_TEMP/nebula-core-direct" --json
          poetry run python scripts/package_audit.py "$sidecar"
          NO_STRIP=1 NEBULA_DISTRIBUTION=direct npm --prefix ui run tauri -- build --ci --target "${{ matrix.target }}" --features direct-updater --bundles appimage --config src-tauri/tauri.direct.conf.json --config "$RUNNER_TEMP/tauri-updater.conf.json"
          appimage="$(find "$bundle/appimage" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          test -s "$appimage.sig"
          install -m 0755 "$appimage" "$stage/Nebula-$NEBULA_VERSION-linux-x86_64.AppImage"
          install -m 0644 "$appimage.sig" "$stage/Nebula-$NEBULA_VERSION-linux-x86_64.AppImage.sig"

          rm -rf "$bundle"
          NEBULA_DISTRIBUTION_CHANNEL=managed poetry run python -m scripts.build_nebula_core
          sidecar="$(find ui/src-tauri/binaries -maxdepth 1 -type f -name 'nebula-core-*' -print -quit)"
          test -n "$sidecar"
          "$sidecar" doctor --data-dir "$RUNNER_TEMP/nebula-core-managed" --json
          poetry run python scripts/package_audit.py "$sidecar"
          NEBULA_DISTRIBUTION=managed npm --prefix ui run tauri -- build --ci --target "${{ matrix.target }}" --bundles deb --config src-tauri/tauri.managed.conf.json
          deb="$(find "$bundle/deb" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          poetry run python -m scripts.repack_deb "$deb" --version "$NEBULA_VERSION"
          install -m 0644 "$deb" "$stage/Nebula-$NEBULA_VERSION-linux-x86_64.deb"
      - name: Inspect and self-test Linux installers
        run: |
          deb="$RUNNER_TEMP/release-stage/Nebula-$NEBULA_VERSION-linux-x86_64.deb"
          appimage="$RUNNER_TEMP/release-stage/Nebula-$NEBULA_VERSION-linux-x86_64.AppImage"
          dpkg-deb --info "$deb"
          expected_deb_version="$NEBULA_VERSION"
          case "$expected_deb_version" in *-*) expected_deb_version="${expected_deb_version/-/\~}" ;; esac
          test "$(dpkg-deb --field "$deb" Version)" = "$expected_deb_version"
          dpkg --compare-versions "$expected_deb_version" le "$NEBULA_VERSION"
          dpkg-deb --extract "$deb" "$RUNNER_TEMP/deb-root"
          test -x "$RUNNER_TEMP/deb-root/usr/bin/nebula"
          test -x "$RUNNER_TEMP/deb-root/usr/bin/nebula-core"
          test -x "$RUNNER_TEMP/deb-root/usr/bin/nebula-ui"
          cmp packaging/linux/nebula "$RUNNER_TEMP/deb-root/usr/bin/nebula"
          poetry run python scripts/package_audit.py --tree "$RUNNER_TEMP/deb-root"
          xvfb-run -a "$RUNNER_TEMP/deb-root/usr/bin/nebula-ui" --self-test
          appimage_extract="$RUNNER_TEMP/appimage-extract"
          install -d -m 0755 "$appimage_extract"
          (cd "$appimage_extract" && "$appimage" --appimage-extract >/dev/null)
          poetry run python scripts/package_audit.py --tree "$appimage_extract/squashfs-root"
          xvfb-run -a "$appimage" --self-test
          cargo run --locked --quiet --manifest-path ui/src-tauri/Cargo.toml \
            --example verify_update_signature -- \
            "$appimage" "$appimage.sig" "$NEBULA_UPDATER_PUBLIC_KEY"
      - name: Generate per-artifact SBOMs and checksums
        run: |
          stage="$RUNNER_TEMP/release-stage"
          for artifact in "$stage"/Nebula-*; do
            case "$artifact" in
              *.sig|*.json) continue ;;
            esac
            direct=
            case "$artifact" in
              *-direct.dmg|*.AppImage|*.updater.tar.gz) direct=--direct ;;
            esac
            poetry run python -m scripts.generate_release_sbom \
              --artifact "$artifact" \
              --root "$GITHUB_WORKSPACE" \
              --target "${{ matrix.target }}" \
              $direct
          done
          (
            cd "$stage"
            shasum -a 256 Nebula-* > "SHA256SUMS-${{ matrix.id }}.txt"
          )
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ runner.temp }}/release-stage/*
      - name: Upload native release outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nebula3-${{ matrix.id }}
          path: ${{ runner.temp }}/release-stage/*
          if-no-files-found: error

  ubuntu-core-smoke:
    needs: [validate, build]
    runs-on: ubuntu-22.04
    container: ubuntu:24.04
    steps:
      - name: Download the native Linux installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nebula3-linux-x64
          path: ${{ runner.temp }}/release-assets
      - name: Install and diagnose the DEB before adding test tooling
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          for command in node npm cargo rustc poetry; do
            if command -v "$command" >/dev/null 2>&1; then
              printf 'clean image unexpectedly contains %s\n' "$command" >&2
              exit 1
            fi
          done
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y xauth xvfb "$RUNNER_TEMP/release-assets/Nebula-$VERSION-linux-x86_64.deb"
          xvfb-run -a /usr/bin/nebula --self-test
          browser="$(find /usr/lib/Nebula/playwright-browsers -type f \( -name chrome -o -name headless_shell -o -name chrome-headless-shell \) -perm /111 -print -quit)"
          test -n "$browser"
          "$browser" --headless --no-sandbox --disable-gpu --dump-dom about:blank | grep -F '<html'
          /usr/bin/nebula-core doctor --data-dir /tmp/nebula-clean-doctor --json > /tmp/doctor.json
          grep -F "\"commit\": \"$COMMIT\"" /tmp/doctor.json
          grep -F '"mode": "analysis-only"' /tmp/doctor.json
          grep -F '"host_fallback": false' /tmp/doctor.json
      - name: Check out the tagged smoke driver
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Add only the smoke driver runtime after installation
        run: apt-get install -y python3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install the locked browser test driver
        run: npm --prefix ui ci
      - name: Collect and run exactly one installed-Core Chromium case
        shell: bash
        env:
          CI: "1"
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          NEBULA_RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          NEBULA_TEST_CORE_BIN: /usr/bin/nebula-core
          NEBULA_TEST_CORE_EMBEDDED_UI: "1"
          NEBULA_RELEASE_CORE_SMOKE: "1"
          PLAYWRIGHT_BROWSERS_PATH: /usr/lib/Nebula/playwright-browsers
        run: |
          case_name='release core smoke pairs, creates a project, and retains one answer'
          args=(tests/real-core.spec.ts --project=real-core --grep "$case_name" --workers=1 --retries=0)
          npm --prefix ui run test:e2e -- "${args[@]}" --list > release-core-smoke-list.txt
          grep -F 'Total: 1 test in 1 file' release-core-smoke-list.txt
          export PLAYWRIGHT_JSON_OUTPUT_FILE="$GITHUB_WORKSPACE/release-core-smoke-playwright.json"
          result=0
          npm --prefix ui run test:e2e -- "${args[@]}" --reporter=json || result=$?
          python3 scripts/release_core_smoke_receipt.py write \
            --receipt release-core-smoke.json \
            --tag "$RELEASE_TAG" --commit "$NEBULA_RELEASE_COMMIT" \
            --deb "$RUNNER_TEMP/release-assets/Nebula-$VERSION-linux-x86_64.deb" \
            --exit-code "$result" --playwright-report "$PLAYWRIGHT_JSON_OUTPUT_FILE"
          exit "$result"
      - name: Upload the exact smoke receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-core-smoke-${{ needs.validate.outputs.tag }}
          path: release-core-smoke.json
          if-no-files-found: ignore
      - name: Uninstall and confirm package removal
        if: always()
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get remove -y nebula
          test ! -e /usr/bin/nebula
          test ! -e /usr/bin/nebula-ui
          test ! -e /usr/bin/nebula-core
