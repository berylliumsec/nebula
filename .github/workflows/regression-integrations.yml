name: Explicit regression integrations

on:
  workflow_dispatch:
    inputs:
      full_approval:
        description: Type RUN_FULL_SUITE after explicit approval to exercise missing integration boundaries
        required: true
        type: string
      review_reason:
        description: Who requested these nine checks and why
        required: true
        type: string
  workflow_call:
    inputs:
      full_approval:
        required: true
        type: string
      review_reason:
        required: true
        type: string

permissions:
  contents: read

jobs:
  approval:
    runs-on: ubuntu-22.04
    steps:
      - name: Require an explicitly requested manual run
        env:
          FULL_APPROVAL: ${{ inputs.full_approval }}
          REVIEW_REASON: ${{ inputs.review_reason }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$FULL_APPROVAL" = RUN_FULL_SUITE
          test -n "$REVIEW_REASON"
          test "$GITHUB_RUN_ATTEMPT" = 1
          printf '%s\n' "$REVIEW_REASON" >> "$GITHUB_STEP_SUMMARY"

  integration-checks:
    needs: approval
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the source test boundary
        run: |
          python -m pip install "poetry==2.1.3"
          poetry install --with dev --no-interaction
      - name: Exercise nine integration checks with real dependencies
        run: bash scripts/run_regression_integrations.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: regression-integration-results
          path: |
            ${{ runner.temp }}/former-skip-tests.xml
            ${{ runner.temp }}/regression-integrations-receipt.json
          if-no-files-found: error
