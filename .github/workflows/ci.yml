name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_approval:
        description: Type RUN_FULL_SUITE after explicit user approval
        required: true
        type: string
      review_reason:
        description: Who requested the full run and why
        required: true
        type: string
      full_scope:
        description: Full regression layer
        type: choice
        default: all
        options: [all, source, native, integrations]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.full_scope || 'selected' }}
  cancel-in-progress: true

jobs:
  full-approval:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Require a fresh explicitly requested full run
        env:
          FULL_APPROVAL: ${{ inputs.full_approval }}
          REVIEW_REASON: ${{ inputs.review_reason }}
        run: |
          test "$FULL_APPROVAL" = RUN_FULL_SUITE
          test -n "$REVIEW_REASON"
          test "$GITHUB_RUN_ATTEMPT" = 1
          printf '%s\n' "$REVIEW_REASON" >> "$GITHUB_STEP_SUMMARY"

  full-source:
    needs: full-approval
    if: inputs.full_scope == 'all' || inputs.full_scope == 'source'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nebula_migrations
          POSTGRES_PASSWORD: nebula
          POSTGRES_USER: nebula
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U nebula -d nebula_migrations"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install complete source-test boundaries
        run: |
          python -m pip install "poetry==2.1.3"
          poetry install --with dev --no-interaction
          npm --prefix ui ci
          npm --prefix ui run build
          sudo apt-get update
          sudo apt-get install -y patchelf
          poetry run playwright install-deps chromium
          poetry run python -m scripts.stage_playwright_runtime "$RUNNER_TEMP/playwright-browsers" --target x86_64-unknown-linux-gnu
          python -m venv "$RUNNER_TEMP/nebula-security-proxy"
          "$RUNNER_TEMP/nebula-security-proxy/bin/pip" install 'mitmproxy==12.2.3'
      - name: Collect and run every Python test
        env:
          NEBULA_FULL_SUITE_APPROVAL: RUN_FULL_SUITE
          NEBULA_FULL_SUITE_REASON: ${{ inputs.review_reason }}
          NEBULA_TEST_POSTGRES_URL: postgresql+psycopg://nebula:nebula@127.0.0.1:5432/nebula_migrations
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
          NEBULA_MITMDUMP_EXECUTABLE: ${{ runner.temp }}/nebula-security-proxy/bin/mitmdump
        run: |
          poetry run pytest --collect-only -q tests packaging
          poetry run pytest -q tests packaging -vv --durations=20 --junitxml="$RUNNER_TEMP/full-tests-python.xml"
      - name: Collect and run every frontend test
        if: success() || failure()
        working-directory: ui
        env:
          NEBULA_FULL_SUITE_APPROVAL: RUN_FULL_SUITE
          NEBULA_FULL_SUITE_REASON: ${{ inputs.review_reason }}
        run: |
          npx vitest list --json="$RUNNER_TEMP/full-tests-frontend-collection.json"
          npm test -- --testTimeout=15000 --maxWorkers=2 --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/full-tests-frontend.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: full-source-test-results
          path: |
            ${{ runner.temp }}/full-tests-python.xml
            ${{ runner.temp }}/full-tests-frontend*.json

  full-native:
    needs: full-approval
    if: inputs.full_scope == 'all' || inputs.full_scope == 'native'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - name: Prepare the compile-time sidecar fixture
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p ui/src-tauri/binaries build/nebula-core-metadata ui/src-tauri/resources/notebook-runtime
          printf 'Generated full-test fixture.\n' > build/nebula-core-metadata/THIRD_PARTY_NOTICES.txt
          printf 'Compile-time resource fixture; no executable notebook runtime.\n' > ui/src-tauri/resources/notebook-runtime/TEST_FIXTURE.txt
          touch "ui/src-tauri/binaries/nebula-core-$target"
          chmod +x "ui/src-tauri/binaries/nebula-core-$target"
      - name: Collect and run every native test
        shell: bash
        run: |
          cargo test --locked --manifest-path ui/src-tauri/Cargo.toml -- --list 2>&1 | tee "$RUNNER_TEMP/full-tests-native-collection.txt"
          cargo test --locked --manifest-path ui/src-tauri/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/full-tests-native.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: full-native-test-results
          path: ${{ runner.temp }}/full-tests-native*.txt

  full-integrations:
    needs: full-approval
    if: inputs.full_scope == 'all' || inputs.full_scope == 'integrations'
    uses: ./.github/workflows/regression-integrations.yml
    with:
      full_approval: ${{ inputs.full_approval }}
      review_reason: ${{ inputs.review_reason }}

  selection:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.plan.outputs.python }}
      frontend: ${{ steps.plan.outputs.frontend }}
      native: ${{ steps.plan.outputs.native }}
      python_browser: ${{ steps.plan.outputs.python_browser }}
      python_node: ${{ steps.plan.outputs.python_node }}
      python_versions: ${{ steps.plan.outputs.python_versions }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate reviewed test selection
        id: plan
        env:
          BASELINE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
          CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/test_selection.py --baseline "$BASELINE" --candidate "$CANDIDATE" --output test-selection-receipt.json
          printf 'python=%s\n' "$(jq -c '.python' test-selection-receipt.json)" >> "$GITHUB_OUTPUT"
          printf 'frontend=%s\n' "$(jq -c '.frontend' test-selection-receipt.json)" >> "$GITHUB_OUTPUT"
          printf 'native=%s\n' "$(jq -c '.native' test-selection-receipt.json)" >> "$GITHUB_OUTPUT"
          printf 'python_browser=%s\n' "$(jq -r '.python_browser // false' test-selection-receipt.json)" >> "$GITHUB_OUTPUT"
          printf 'python_node=%s\n' "$(jq -r '.python_node // false' test-selection-receipt.json)" >> "$GITHUB_OUTPUT"
          printf 'python_versions=%s\n' "$(jq -c '.python_versions // ["3.12"]' test-selection-receipt.json)" >> "$GITHUB_OUTPUT"
          cat test-selection-receipt.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-selection-receipt
          path: test-selection-receipt.json
  python:
    needs: selection
    if: always()
    runs-on: ubuntu-latest
    env:
      RUN_SELECTED: ${{ needs.selection.result == 'success' && needs.selection.outputs.python != '[]' && contains(fromJSON(needs.selection.outputs.python_versions || '[]'), matrix.python-version) }}
    strategy:
      fail-fast: false
      matrix:
        # Keep required branch-protection check names, not implicit test runs.
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: ${{ needs.selection.result == 'success' && contains(fromJSON(needs.selection.outputs.python_versions || '[]'), matrix.python-version) && (contains(needs.selection.outputs.python, 'tests/v3/test_async_postgresql.py') || contains(needs.selection.outputs.python, 'tests/v3/test_async_harness_queries.py') || contains(needs.selection.outputs.python, 'tests/v3/test_async_rollback.py')) && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_DB: nebula_async
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_USER: nebula_async
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U nebula_async -d nebula_async"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Require a valid reviewed selection
        env:
          SELECTION_RESULT: ${{ needs.selection.result }}
        run: test "$SELECTION_RESULT" = success
      - name: Record omitted runtime without running tests
        if: env.RUN_SELECTED != 'true'
        run: echo 'This Python runtime was not selected. No installation or tests run; see the test-selection receipt.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: env.RUN_SELECTED == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.RUN_SELECTED == 'true' && needs.selection.outputs.python_node == 'true'
        with:
          node-version: 20
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: env.RUN_SELECTED == 'true'
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Poetry
        if: env.RUN_SELECTED == 'true'
        run: python -m pip install "poetry==2.1.3"
      - name: Validate package metadata
        if: env.RUN_SELECTED == 'true'
        run: poetry check
      - name: Install project
        if: env.RUN_SELECTED == 'true'
        run: poetry install --no-interaction
      - name: Install patchelf for selected notebook packaging regression
        if: env.RUN_SELECTED == 'true' && contains(needs.selection.outputs.python, 'tests/v3/test_packaging.py::test_notebook_runtime_rpaths_are_linuxdeploy_stable')
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
      - name: Install Chromium for browser runtime regression tests
        if: env.RUN_SELECTED == 'true' && needs.selection.outputs.python_browser == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          poetry run playwright install-deps chromium
          poetry run python -m scripts.stage_playwright_runtime "$RUNNER_TEMP/playwright-browsers" --target x86_64-unknown-linux-gnu
      - name: Install isolated proxy for selected headless integration tests
        if: env.RUN_SELECTED == 'true' && contains(needs.selection.outputs.python, 'tests/v3/test_agent_security_headless.py')
        run: |
          python -m venv "$RUNNER_TEMP/nebula-security-proxy"
          "$RUNNER_TEMP/nebula-security-proxy/bin/pip" install 'mitmproxy==12.2.3'
      - name: Install UI dependencies for selected Node-backed Python checks
        if: env.RUN_SELECTED == 'true' && (contains(needs.selection.outputs.python, 'tests/test_playwright_impact.py') || contains(needs.selection.outputs.python, 'tests/v3/test_butler_workflow_registry.py'))
        run: npm --prefix ui ci
      - name: Test
        if: env.RUN_SELECTED == 'true'
        env:
          SELECTED_TESTS: ${{ needs.selection.outputs.python }}
          NEBULA_TEST_POSTGRES_URL: ${{ (contains(needs.selection.outputs.python, 'tests/v3/test_async_postgresql.py') || contains(needs.selection.outputs.python, 'tests/v3/test_async_harness_queries.py') || contains(needs.selection.outputs.python, 'tests/v3/test_async_rollback.py')) && 'postgresql+psycopg://nebula_async:synthetic-ci-password@127.0.0.1:5432/nebula_async' || '' }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
          NEBULA_MITMDUMP_EXECUTABLE: ${{ runner.temp }}/nebula-security-proxy/bin/mitmdump
        run: |
          if jq -e 'any(.[]; test("^tests/v3/test_async_(postgresql|harness_queries|rollback)[.]py"))' <<<"$SELECTED_TESTS" >/dev/null; then
            test -n "$NEBULA_TEST_POSTGRES_URL" || { echo 'Selected PostgreSQL coverage requires its owned database runtime.' >&2; exit 1; }
          fi
          mapfile -t targets < <(jq -r '.[]' <<<"$SELECTED_TESTS")
          poetry run pytest --collect-only -q "${targets[@]}"
          poetry run pytest -q -W error::RuntimeWarning -W error::pytest.PytestUnraisableExceptionWarning "${targets[@]}"
      - name: Lint Nebula 3
        if: env.RUN_SELECTED == 'true'
        run: poetry run ruff check src/nebula/v3 tests/v3
      - name: Check Nebula 3 formatting
        if: env.RUN_SELECTED == 'true'
        run: poetry run ruff format --check src/nebula/v3 tests/v3
      - name: Audit diagnostic blind spots
        if: env.RUN_SELECTED == 'true' && matrix.python-version == '3.12'
        run: poetry run python scripts/audit_diagnostic_blind_spots.py --python --rust
      - name: Type-check Nebula 3
        if: env.RUN_SELECTED == 'true' && matrix.python-version == '3.12'
        run: poetry run mypy src/nebula/v3
      - name: Build distributions
        if: env.RUN_SELECTED == 'true'
        run: poetry build

  terminal-client:
    needs: selection
    if: contains(needs.selection.outputs.python, 'tests/test_terminal_')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install only the terminal distribution
        run: |
          python -m pip install 'build>=1.2,<2' 'setuptools>=77' wheel packaging pytest 'pyte>=0.8.2,<1'
          python -m scripts.build_terminal_client --no-isolation --out-dir "$RUNNER_TEMP/terminal-client"
          python -m pip install "$RUNNER_TEMP"/terminal-client/*.whl
      - name: Run only the selected terminal contracts
        env:
          SELECTED_TESTS: ${{ needs.selection.outputs.python }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          targets = [item for item in json.loads(os.environ['SELECTED_TESTS']) if item.startswith('tests/test_terminal_')]
          assert targets, 'No reviewed terminal test targets'
          subprocess.run([sys.executable, '-m', 'pytest', '--collect-only', '-q', *targets], check=True)
          subprocess.run([sys.executable, '-m', 'pytest', '-q', *targets], check=True)
          PY
      - name: Attach the reviewed client distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-client-distributions
          path: ${{ runner.temp }}/terminal-client/*
          if-no-files-found: error

  database-migrations:
    needs: selection
    if: contains(needs.selection.outputs.python, 'tests/v3/test_migrations.py') || contains(needs.selection.outputs.python, 'tests/v3/test_database_migration') || contains(needs.selection.outputs.python, 'tests/v3/test_postgresql_core.py') || contains(needs.selection.outputs.python, 'tests/test_simulation_postgres_backup.py')
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nebula_migrations
          POSTGRES_PASSWORD: nebula
          POSTGRES_USER: nebula
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nebula -d nebula_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEBULA_TEST_POSTGRES_URL: postgresql+psycopg://nebula:nebula@127.0.0.1:5432/nebula_migrations
      NEBULA_TEST_POSTGRES_CLI_URL: postgresql+psycopg://nebula:nebula@127.0.0.1:5432/nebula_migration_cli
      NEBULA_TEST_POSTGRES_BACKUP_URL: postgresql+psycopg://nebula:nebula@127.0.0.1:5432/nebula_backup_test
      SELECTED_TESTS: ${{ needs.selection.outputs.python }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "poetry==2.1.3"
      - run: poetry install --with dev --no-interaction
      - name: Install matching PostgreSQL backup clients
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Prepare isolated migration and backup databases
        run: |
          poetry run python - <<'PY'
          import psycopg
          from psycopg import sql
          with psycopg.connect('postgresql://nebula:nebula@127.0.0.1:5432/nebula_migrations', autocommit=True) as connection:
              for name in ('nebula_migration_cli', 'nebula_backup_test'):
                  connection.execute(sql.SQL('CREATE DATABASE {}').format(sql.Identifier(name)))
          PY
      - name: Exercise only the reviewed PostgreSQL contracts
        run: |
          poetry run python - <<'PY'
          import json, os, subprocess, sys
          prefixes = ('tests/v3/test_migrations.py', 'tests/v3/test_database_migration', 'tests/v3/test_postgresql_core.py', 'tests/test_simulation_postgres_backup.py')
          targets = [item for item in json.loads(os.environ['SELECTED_TESTS']) if item.startswith(prefixes)]
          assert targets, 'No reviewed PostgreSQL test targets'
          subprocess.run([sys.executable, '-m', 'pytest', '--collect-only', '-q', *targets], check=True)
          subprocess.run([sys.executable, '-m', 'pytest', '-q', *targets], check=True)
          PY

  frontend:
    needs: selection
    if: needs.selection.outputs.frontend != '[]'
    runs-on: ubuntu-latest
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: python -m pip install "poetry==2.1.3"
        working-directory: .
      - run: poetry install --only main --no-interaction
        working-directory: .
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run audit:diagnostics
      - name: Test selected frontend files
        env:
          SELECTED_TESTS: ${{ needs.selection.outputs.frontend }}
        run: |
          mapfile -t targets < <(jq -r '.[] | ltrimstr("ui/")' <<<"$SELECTED_TESTS")
          npm test -- "${targets[@]}" --testTimeout=15000
      - run: npm run build

  cpu-workers-frozen-linux:
    needs: selection
    if: contains(needs.selection.outputs.python, 'tests/v3/test_report_cpu_activation.py')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - run: python -m pip install "poetry==2.1.3"
      - run: poetry install --with dev --no-interaction
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - name: Build the actual frozen Linux Core
        run: poetry run python -m scripts.build_nebula_core
      - name: Exercise one owned native activation journey
        run: >-
          poetry run python scripts/benchmarks/core_worker_activation_smoke.py
          --binary dist/nebula-core --output frozen-cpu-activation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frozen-cpu-activation
          path: |
            frozen-cpu-activation.json
            frozen-cpu-activation.core.log
            build/nebula-core-metadata/BUILD_INFO.json
            src/nebula/v3/product_knowledge.sqlite3.b85

  async-runtime-frozen-linux:
    needs: selection
    if: contains(needs.selection.outputs.python, 'tests/v3/test_packaging.py::test_core_archive_requires_native_async_database_runtime')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      NEBULA_TEST_POSTGRES_URL: postgresql+psycopg://nebula_runtime:synthetic-runtime-password@127.0.0.1:5432/nebula_frozen
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nebula_frozen
          POSTGRES_PASSWORD: synthetic-admin-password
          POSTGRES_USER: nebula_admin
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U nebula_admin -d nebula_frozen"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - run: python -m pip install "poetry==2.1.3"
      - run: poetry install --with dev --no-interaction
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - name: Allocate the owned non-administrative PostgreSQL fixture role
        run: |
          poetry run python - <<'PYTHON'
          import psycopg
          with psycopg.connect("postgresql://nebula_admin:synthetic-admin-password@127.0.0.1:5432/nebula_frozen", autocommit=True) as connection:
              connection.execute("CREATE ROLE nebula_runtime LOGIN PASSWORD 'synthetic-runtime-password'")
              connection.execute("GRANT CREATE ON DATABASE nebula_frozen TO nebula_runtime")
          PYTHON
      - name: Build the actual frozen Linux Core and current product index
        run: poetry run python -m scripts.build_nebula_core
      - name: Exercise exactly two owned frozen database journeys
        run: >-
          poetry run python scripts/verify_async_frozen_core.py
          --binary dist/nebula-core --output frozen-async-database.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frozen-async-database
          path: |
            frozen-async-database.json
            frozen-async-database.*.core.log
            build/nebula-core-metadata/BUILD_INFO.json
            src/nebula/v3/product_knowledge.sqlite3.b85

  desktop-macos:
    needs: selection
    if: needs.selection.outputs.native != '[]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - run: python -m pip install "poetry==2.1.3"
      - run: poetry install --with dev --no-interaction
      - name: Test macOS Docker Desktop and Podman Machine command boundaries
        run: poetry run pytest -q tests/v3/test_sandbox.py -k macos
      - name: Prepare compile-time sidecar boundary
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p ui/src-tauri/binaries ui/src-tauri/resources/notebook-runtime
          mkdir -p build/nebula-core-metadata
          printf 'Generated CI fixture for native shell tests.\n' > build/nebula-core-metadata/THIRD_PARTY_NOTICES.txt
          printf 'Compile-time resource fixture; no executable notebook runtime.\n' > ui/src-tauri/resources/notebook-runtime/TEST_FIXTURE.txt
          touch "ui/src-tauri/binaries/nebula-core-$target"
          chmod +x "ui/src-tauri/binaries/nebula-core-$target"
      - name: Test native menus and sidecar boundary
        env:
          SELECTED_TESTS: ${{ needs.selection.outputs.native }}
        run: |
          while IFS= read -r target; do
            cargo test --locked --manifest-path ui/src-tauri/Cargo.toml "$target" -- --exact --list | grep -F "$target: test"
            cargo test --locked --manifest-path ui/src-tauri/Cargo.toml "$target" -- --exact
          done < <(jq -r '.[]' <<<"$SELECTED_TESTS")

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          path: .
          format: spdx-json
          output-file: nebula.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: nebula.spdx.json
