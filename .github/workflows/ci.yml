name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Poetry
        run: python -m pip install "poetry==2.1.3"
      - name: Validate package metadata
        run: poetry check
      - name: Install project
        run: poetry install --no-interaction
      - name: Test
        run: poetry run pytest -q tests/v3
      - name: Lint Nebula 3
        run: poetry run ruff check src/nebula/v3 tests/v3
      - name: Check Nebula 3 formatting
        run: poetry run ruff format --check src/nebula/v3 tests/v3
      - name: Audit diagnostic blind spots
        if: matrix.python-version == '3.12'
        run: poetry run python scripts/audit_diagnostic_blind_spots.py --python --rust
      - name: Type-check Nebula 3
        if: matrix.python-version == '3.12'
        run: poetry run mypy src/nebula/v3
      - name: Build distributions
        run: poetry build

  database-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nebula_migrations
          POSTGRES_PASSWORD: nebula
          POSTGRES_USER: nebula
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nebula -d nebula_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEBULA_TEST_POSTGRES_URL: postgresql+psycopg://nebula:nebula@127.0.0.1:5432/nebula_migrations
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "poetry==2.1.3"
      - run: poetry install --with dev --no-interaction
      - name: Exercise SQLite and PostgreSQL upgrade/downgrade paths
        run: >-
          poetry run pytest -q tests/v3/test_migrations.py

  frontend:
    runs-on: ubuntu-latest
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: python -m pip install "poetry==2.1.3"
        working-directory: .
      - run: poetry install --only main --no-interaction
        working-directory: .
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run audit:diagnostics
      - run: npm test -- --testTimeout=15000
      - run: npm run build

  desktop-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - run: python -m pip install "poetry==2.1.3"
      - run: poetry install --with dev --no-interaction
      - name: Test macOS Docker Desktop and Podman Machine command boundaries
        run: poetry run pytest -q tests/v3/test_sandbox.py -k macos
      - name: Prepare compile-time sidecar boundary
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p ui/src-tauri/binaries
          mkdir -p build/nebula-core-metadata
          printf 'Generated CI fixture for native shell tests.\n' > build/nebula-core-metadata/THIRD_PARTY_NOTICES.txt
          touch "ui/src-tauri/binaries/nebula-core-$target"
          chmod +x "ui/src-tauri/binaries/nebula-core-$target"
      - name: Test native menus and sidecar boundary
        run: cargo test --locked --manifest-path ui/src-tauri/Cargo.toml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          path: .
          format: spdx-json
          output-file: nebula.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: nebula.spdx.json
