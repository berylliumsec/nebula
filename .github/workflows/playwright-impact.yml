name: Change-aware Playwright matrix

on:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Playwright coverage to run
        required: true
        default: impacted
        type: choice
        options: [impacted, full]
      selection:
        description: Optional catalog selectors, e.g. area:assistant,entry:themes/mobile-webkit
        required: false
        type: string
      review_reason:
        description: Why these tests cover the change, including exclusions
        required: true
        type: string
      full_approval:
        description: Exceptional full run only; type RUN_FULL_SUITE after explicit user approval
        required: false
        type: string
  workflow_call:
    inputs:
      baseline_sha: {type: string, required: false, default: ""}
      candidate_sha: {type: string, required: true}
      candidate_ref: {type: string, required: true}
      scope: {type: string, required: false, default: impacted}
      receipt_name: {type: string, required: false, default: playwright-impact-receipt}
      selection: {type: string, required: false, default: ""}
      review_reason: {type: string, required: false, default: ""}
      full_approval: {type: string, required: false, default: ""}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      matrix_1: ${{ steps.select.outputs.matrix_1 }}
      matrix_2: ${{ steps.select.outputs.matrix_2 }}
      matrix_3: ${{ steps.select.outputs.matrix_3 }}
      matrix_4: ${{ steps.select.outputs.matrix_4 }}
      has_1: ${{ steps.select.outputs.has_1 }}
      has_2: ${{ steps.select.outputs.has_2 }}
      has_3: ${{ steps.select.outputs.has_3 }}
      has_4: ${{ steps.select.outputs.has_4 }}
    steps:
      - name: Check out the candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_ref || github.event.pull_request.head.sha || github.sha }}
      - name: Generate impact plan
        id: select
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha || github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          REQUESTED_SCOPE: ${{ inputs.scope || github.event.inputs.scope || 'impacted' }}
          EXPLICIT_SELECTION: ${{ inputs.selection || github.event.inputs.selection }}
          REVIEW_REASON: ${{ inputs.review_reason || github.event.inputs.review_reason }}
          FULL_APPROVAL: ${{ inputs.full_approval || github.event.inputs.full_approval }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if test "$EVENT_NAME" = pull_request; then
            python scripts/test_selection.py --baseline "$BASELINE_SHA" --candidate "$CANDIDATE_SHA" --output "$RUNNER_TEMP/reviewed-tests.json"
            EXPLICIT_SELECTION="$(jq -r 'if (.playwright|length)==0 then "none" else .playwright|join(",") end' "$RUNNER_TEMP/reviewed-tests.json")"
            REVIEW_REASON="$(jq -r '.reason + " Exclusions: " + .exclusions' "$RUNNER_TEMP/reviewed-tests.json")"
          fi
          args=(
            --manifest ui/playwright-impact.json
            --candidate "$CANDIDATE_SHA"
            --scope "$REQUESTED_SCOPE"
            --output playwright-impact-plan.json
            --receipt playwright-impact-receipt.md
            --review-reason "$REVIEW_REASON"
          )
          if test "$REQUESTED_SCOPE" = full; then
            test "$EVENT_NAME" = workflow_dispatch
            test "$FULL_APPROVAL" = RUN_FULL_SUITE
            test -n "$REVIEW_REASON"
            args+=(--full-approved)
          fi
          if test -n "$BASELINE_SHA" && git cat-file -e "$BASELINE_SHA^{commit}" 2>/dev/null; then
            args+=(--baseline "$BASELINE_SHA")
          fi
          if test -n "$EXPLICIT_SELECTION"; then
            args+=(--selection "$EXPLICIT_SELECTION")
          fi
          python scripts/playwright_impact.py select "${args[@]}" > "$RUNNER_TEMP/matrix.json"
          python scripts/playwright_impact.py lanes \
            --plan playwright-impact-plan.json \
            --github-output "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          cat playwright-impact-receipt.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload impact receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.receipt_name || 'playwright-impact-receipt' }}
          path: |
            playwright-impact-plan.json
            playwright-impact-receipt.md
            ${{ runner.temp }}/reviewed-tests.json
          if-no-files-found: error

  playwright:
    needs: plan
    if: needs.plan.outputs.has_1 == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_1) }}
    runs-on: ubuntu-22.04
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      NEBULA_PLAYWRIGHT_MATRIX: "1"
      PLAYWRIGHT_LANE: "1"
    steps: &playwright_steps
      - name: Check out the candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_ref || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: matrix.runtime != 'mock'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install UI boundary and required browser
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          npm --prefix ui ci
          case "$PROJECT" in *webkit*) browser=webkit ;; *) browser=chromium ;; esac
          npx --prefix ui playwright install --with-deps "$browser"
      - name: Install real-Core boundary
        if: matrix.runtime != 'mock'
        run: |
          python -m pip install "poetry==2.1.3"
          poetry install --with dev --no-interaction
      - name: Build production UI
        run: npm --prefix ui run build
      - name: Prepare verified Chromium for the selected assistant browser journeys
        if: matrix.grep == 'assistant upgrade linked reply opens a durable file and scoped website in the right pane from production LAN Core' || matrix.grep == 'assistant upgrade settings assistant saves all URL targets and starts headless browser on production LAN Core'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf xvfb
          poetry run python -m scripts.stage_playwright_runtime "$RUNNER_TEMP/playwright-browsers" --target x86_64-unknown-linux-gnu
      - name: Prepare isolated security proxy for the selected headless browser journey
        if: matrix.grep == 'assistant upgrade settings assistant saves all URL targets and starts headless browser on production LAN Core'
        run: |
          python -m venv "$RUNNER_TEMP/nebula-security-proxy"
          "$RUNNER_TEMP/nebula-security-proxy/bin/pip" install 'mitmproxy==12.2.3'
      - name: Run selected entry serially
        env:
          PROJECT: ${{ matrix.project }}
          TEST_MATCH: ${{ matrix.test_match }}
          TEST_GREP: ${{ matrix.grep }}
          TEST_SHARD: ${{ matrix.shard }}
          NEBULA_UI_TEST_COMMAND: npm run preview -- --host 0.0.0.0 --port 1420
        run: |
          args=("$TEST_MATCH" --project "$PROJECT" --workers 1 --shard "$TEST_SHARD")
          if test -n "$TEST_GREP"; then args+=(--grep "$TEST_GREP"); fi
          # This selected Core file is monolithic. Without fully-parallel
          # collection Playwright assigns all its tests to shard 1, leaving
          # later shards empty even though each runner still uses one worker.
          if test "$PROJECT" = real-core && test "$TEST_SHARD" != 1/1; then
            args+=(--fully-parallel)
          fi
          # Listing is cheap and records the actual selected tests/count before running.
          npm --prefix ui run test:e2e -- "${args[@]}" --list
          if test "$TEST_GREP" = 'assistant upgrade linked reply opens a durable file and scoped website in the right pane from production LAN Core' ||
             test "$TEST_GREP" = 'assistant upgrade settings assistant saves all URL targets and starts headless browser on production LAN Core'; then
            if test "$TEST_GREP" = 'assistant upgrade settings assistant saves all URL targets and starts headless browser on production LAN Core'; then
              export NEBULA_TEST_SECURITY_PROXY_EXECUTABLE="$RUNNER_TEMP/nebula-security-proxy/bin/mitmdump"
            fi
            NEBULA_TEST_MANAGED_BROWSER_RUNTIME="$RUNNER_TEMP/playwright-browsers" xvfb-run -a npm --prefix ui run test:e2e -- "${args[@]}"
          else
            npm --prefix ui run test:e2e -- "${args[@]}"
          fi
      - name: Retain browser failure and retry evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ env.PLAYWRIGHT_LANE }}-${{ strategy.job-index }}-${{ matrix.project }}
          path: ui/test-results/
          if-no-files-found: ignore
          retention-days: 7

  playwright-2:
    needs: plan
    if: needs.plan.outputs.has_2 == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_2) }}
    runs-on: ubuntu-22.04
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      NEBULA_PLAYWRIGHT_MATRIX: "1"
      PLAYWRIGHT_LANE: "2"
    steps: *playwright_steps

  playwright-3:
    needs: plan
    if: needs.plan.outputs.has_3 == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_3) }}
    runs-on: ubuntu-22.04
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      NEBULA_PLAYWRIGHT_MATRIX: "1"
      PLAYWRIGHT_LANE: "3"
    steps: *playwright_steps

  playwright-4:
    needs: plan
    if: needs.plan.outputs.has_4 == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_4) }}
    runs-on: ubuntu-22.04
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      NEBULA_PLAYWRIGHT_MATRIX: "1"
      PLAYWRIGHT_LANE: "4"
    steps: *playwright_steps

  gate:
    needs: [plan, playwright, playwright-2, playwright-3, playwright-4]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Require selector and every selected matrix entry
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          HAS_1: ${{ needs.plan.outputs.has_1 }}
          HAS_2: ${{ needs.plan.outputs.has_2 }}
          HAS_3: ${{ needs.plan.outputs.has_3 }}
          HAS_4: ${{ needs.plan.outputs.has_4 }}
          RESULT_1: ${{ needs.playwright.result }}
          RESULT_2: ${{ needs['playwright-2'].result }}
          RESULT_3: ${{ needs['playwright-3'].result }}
          RESULT_4: ${{ needs['playwright-4'].result }}
        run: |
          test "$PLAN_RESULT" = success
          check_lane() {
            if test "$1" = true; then
              test "$2" = success
            else
              test "$2" = skipped
            fi
          }
          check_lane "$HAS_1" "$RESULT_1"
          check_lane "$HAS_2" "$RESULT_2"
          check_lane "$HAS_3" "$RESULT_3"
          check_lane "$HAS_4" "$RESULT_4"
