name: Rebuild product knowledge for CPU experiment

on:
  push:
    branches: [experiment/core-process-workers]
    paths:
      - .github/workflows/cpu-experiment-knowledge.yml
      - docs/design/nebula-settings-assistant.md
      - ui/src/settingsCatalog.ts

permissions:
  contents: write

jobs:
  rebuild:
    if: github.ref == 'refs/heads/experiment/core-process-workers'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install only the knowledge builder dependencies
        run: python -m pip install 'numpy<3' 'chromadb>=1.5.9,<2'
      - name: Rebuild and verify the current guidance
        run: |
          python scripts/build_product_knowledge.py
          python scripts/build_product_knowledge.py --verify
      - name: Save the generated index on the experimental branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nebula/v3/product_knowledge.sqlite3.b85
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh product knowledge for Butler host-load reads'
            git push origin HEAD:experiment/core-process-workers
          fi
