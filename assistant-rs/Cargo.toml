[workspace]
members = ["crates/domain", "crates/storage", "crates/runtime", "crates/services", "crates/transport", "crates/lab", "crates/integrations"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
nebula-assistant-domain = { path = "crates/domain" }
nebula-assistant-storage = { path = "crates/storage" }
nebula-assistant-runtime = { path = "crates/runtime" }
nebula-assistant-services = { path = "crates/services" }
nebula-assistant-transport = { path = "crates/transport" }
nebula-assistant-integrations = { path = "crates/integrations" }
reqwest = { version = "=0.13.4", default-features = false, features = ["http2", "rustls", "json", "stream", "gzip", "deflate"] }
axum = "=0.8.8"
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.3"
form_urlencoded = "=1.2.2"
subtle = "=2.6.1"
tracing = "=0.1.44"
speedate = "=0.17.0"
strum = "=0.27.2"
sha2 = "=0.10.9"
num-bigint = "=0.4.8"
num-traits = "=0.2.19"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "=4.6.1", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["arbitrary_precision", "raw_value"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "json"] }
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
uuid = { version = "=1.23.4", features = ["v4", "serde"] }
tempfile = "=3.27.0"
fs2 = "=0.4.3"
nix = { version = "=0.30.1", default-features = false, features = ["user"] }
futures-util = "=0.3.32"
jsonschema = { version = "=0.57.0", default-features = false, features = ["arbitrary-precision"] }
rustix = { version = "=1.1.5", features = ["fs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 1
