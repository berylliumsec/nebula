[workspace]
members = ["crates/domain", "crates/storage", "crates/runtime", "crates/lab"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
nebula-assistant-domain = { path = "crates/domain" }
nebula-assistant-storage = { path = "crates/storage" }
nebula-assistant-runtime = { path = "crates/runtime" }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "=4.6.1", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["arbitrary_precision"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "json"] }
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "=1.23.4", features = ["v4", "serde"] }
tempfile = "=3.27.0"
fs2 = "=0.4.3"
futures-util = "=0.3.32"
jsonschema = { version = "=0.57.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 1
