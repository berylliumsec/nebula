# Drop-in for the supervisor unit when nebula-core.socket holds the listener.
# The deployer refuses a socket-activated host swap unless all of this holds.
[Unit]
Requires=nebula-core.socket
After=nebula-core.socket

[Service]
# Workers outlive a supervisor generation.
KillMode=process
ExitType=main
# Longer than the deployer's 30 s supervisor stop grace (plus margin), so the
# deployer, not systemd, ends a supervisor that does not stop, while the unit
# is still stopping and the socket cannot start a second one beside it.
TimeoutStopSec=90
