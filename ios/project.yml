name: Nebula
options:
  bundleIdPrefix: com.berylliumsec
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '6'
targets:
  Nebula:
    type: application
    platform: iOS
    sources:
      - path: Nebula
      # Built Core web UI, copied by bundle-web-ui.sh; served on 127.0.0.1 by LocalUIServer.
      - path: WebUI
        type: folder
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.berylliumsec.nebula.ios
        INFOPLIST_FILE: Nebula/Info.plist
schemes:
  Nebula:
    build:
      targets:
        Nebula: all
