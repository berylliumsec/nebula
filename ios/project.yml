name: Nebula
options:
  bundleIdPrefix: com.berylliumsec
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '3'
targets:
  Nebula:
    type: application
    platform: iOS
    sources: [Nebula]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.berylliumsec.nebula.ios
        INFOPLIST_FILE: Nebula/Info.plist
schemes:
  Nebula:
    build:
      targets:
        Nebula: all
